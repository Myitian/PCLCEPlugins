name: build
on: [pull_request, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Build UnlockPCLCE
      run: dotnet build -c Release UnlockPCLCE
    - name: Collect UnlockPCLCE artifacts
      run: mv UnlockPCLCE/bin/Release/net10.0/UnlockPCLCE.dll UnlockPCLCE.dll
    - name: Build Launcher
      run: dotnet publish -p:PublishProfile=FolderProfile Launcher
    - name: Collect Launcher artifacts
      run: mv Launcher/bin/Release/net10.0/publish/win-x64/Launcher.exe Launcher.exe
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: |
          UnlockPCLCE.dll
          Launcher.exe
