name: build
on: [pull_request, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
    - name: Prepare binaries
      run: |
        cd binary
        dotnet run getdlls.cs
        cd ..
    - name: Build projects
      run: |
        dotnet publish -p:PublishProfile=win-x64
        mkdir artifacts
        mv Launcher/bin/Publish/win-x64/Launcher.exe artifacts/
        mv PCLCEPluginManager/bin/Publish/win-x64/PCLCEPluginManager.dll artifacts/
        mv PCLCEPluginManager/bin/Publish/win-x64/0Harmony.dll artifacts/
        mv UnlockPCLCE/bin/Publish/win-x64/UnlockPCLCE.dll artifacts/
        mv ColorfulPCLCE/bin/Publish/win-x64/ColorfulPCLCE.dll artifacts/
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: artifacts/